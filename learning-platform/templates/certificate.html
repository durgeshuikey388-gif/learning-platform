<!DOCTYPE html>
<html>
<head>
<title>Certificate</title>

<style>
body{
    text-align:center;
    background:#111;
    color:white;
    font-family:Arial;
}

iframe{
    width:80%;
    height:500px;
    border-radius:10px;
    margin-top:20px;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#4caf50;
    color:white;
    cursor:pointer;
}
</style>

</head>
<body>

<h1> Certificate Generated</h1>

<h3>Name: {{name}}</h3>
<h3>Score: {{score}}</h3>
<h3>Percentage: {{percent}}%</h3>
<h3>Date: {{date}}</h3>

<!-- PDF Preview -->
<iframe src="/static/certificate.pdf"></iframe>

<br>

<!-- Buttons -->
<a href="/download">
    <button>⬇ Download Certificate</button>
</a>

<a href="/">
    <button>🏠 Home</button>
</a>

</body>
</html>
