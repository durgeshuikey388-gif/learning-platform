<!DOCTYPE html>
<html>
<head>

<title>Admin Login</title>

<style>

body{
    font-family: Arial;
    text-align:center;

    background-image: url('/static/bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color:white;
}

.login-box{
    width:350px;

    margin:100px auto;

    background: rgba(0,0,0,0.6);

    padding:30px;

    border-radius:15px;

    backdrop-filter: blur(10px);

    box-shadow:0 0 15px rgba(255,255,255,0.3);
}

input{
    width:90%;

    padding:12px;

    margin:10px;

    border:none;

    border-radius:8px;

    font-size:16px;
}

button{
    padding:12px 25px;

    background:#00bcd4;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;
}

button:hover{
    background:#0097a7;
}

h2{
    margin-bottom:25px;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<form method="POST">

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">Login</button>

</form>

</div>

</body>
</html>
