<!DOCTYPE html>
<html>
<head>

<title>Certificate</title>

<style>

body{
    font-family: Arial;
    text-align:center;
    margin-top:100px;

    background-image: url('/static/bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color:white;
}

.box{
    width:400px;

    margin:auto;

    background: rgba(0,0,0,0.6);

    padding:35px;

    border-radius:15px;

    backdrop-filter: blur(10px);

    box-shadow:0 0 15px rgba(255,255,255,0.2);
}

input{
    width:90%;

    padding:12px;

    border-radius:8px;

    border:none;

    font-size:16px;
}

button{
    padding:12px 25px;

    background:#4caf50;

    border:none;

    color:white;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;
}

button:hover{
    background:#2e7d32;
}

h2{
    text-shadow:2px 2px 10px black;
}

</style>

</head>

<body>

<div class="box">

<h2>Enter Your Name</h2>

<form action="/certificate" method="POST">

    <input type="text"
           name="name"
           placeholder="Enter your name"
           required>

    <br><br>

    <button>
    Generate Certificate
    </button>

</form>

</div>

</body>
</html>
