<!DOCTYPE html>
<html>
<head>

<title>Result</title>

<style>

body{
    font-family: Arial;
    padding:20px;

    background-image: url('/static/bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color:white;
}

.result-box{
    background: rgba(0,0,0,0.6);

    padding:30px;

    border-radius:15px;

    backdrop-filter: blur(10px);

    box-shadow:0 0 15px rgba(255,255,255,0.2);
}

.correct{
    color:lime;
}

.wrong{
    color:red;
}

.card{
    background: rgba(255,255,255,0.1);

    padding:15px;

    margin:15px 0;

    border-radius:12px;
}

button{
    padding:12px 25px;

    background:#ff9800;

    border:none;

    border-radius:8px;

    color:white;

    font-size:16px;

    cursor:pointer;
}

button:hover{
    background:#f57c00;
}

h1,h2{
    text-align:center;
    text-shadow:2px 2px 10px black;
}

</style>

</head>

<body>

<div class="result-box">

<h1>
🎯 Score: {{score}} / {{total}}
</h1>

<h2>
📊 {{percent}}%
</h2>

{% for r in results %}

<div class="card">

    <p>
    <b>{{r.q}}</b>
    </p>

    {% if r.status=="correct" %}

        <p class="correct">
        ✔ {{r.user}}
        </p>

    {% else %}

        <p class="wrong">
        ✘ {{r.user}}
        </p>

        <p>
        Correct: {{r.correct}}
        </p>

    {% endif %}

</div>

{% endfor %}

<center>

<a href="/get_certificate">

    <button>
    🎓 Get Certificate
    </button>

</a>

</center>

</div>

</body>
</html>
