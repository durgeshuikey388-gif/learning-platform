<!DOCTYPE html>
<html>
<head>
<title>Programming Theory Hub</title>

<style>
body{
    margin:0;
    font-family: Arial;

    background-image: url('/static/bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color:white;
}

.container{
    text-align:center;
    margin-top:50px;
}

.card{
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    padding:20px;
    margin:15px;
    border-radius:15px;
    display:inline-block;
    width:250px;

    box-shadow: 0 0 15px rgba(255,255,255,0.2);
}

a{
    color:white;
    text-decoration:none;
    padding:8px 15px;
    border:1px solid white;
    border-radius:8px;
    margin:5px;
    display:inline-block;
}

a:hover{
    background:white;
    color:black;
}

h1{
    font-size:50px;
    text-shadow: 2px 2px 10px black;
}
</style>

</head>

<body>

<div class="container">

<h1>Programming Theory Hub</h1>

{% for c in courses %}

<div class="card">

    <h2>{{c.upper()}}</h2>

    <a href="/course/{{c}}">Theory</a>

    <a href="/quiz/{{c}}">Quiz</a>

</div>

{% endfor %}

</div>

</body>
</html>
