<!DOCTYPE html>
<html>
<head>

<title>Certificate</title>

<style>

body{
    text-align:center;
    font-family:Arial;

    background-image: url('/static/bg.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color:white;
}

.box{
    width:90%;

    margin:30px auto;

    background: rgba(0,0,0,0.6);

    padding:30px;

    border-radius:15px;

    backdrop-filter: blur(10px);

    box-shadow:0 0 15px rgba(255,255,255,0.2);
}

iframe{
    width:80%;
    height:500px;

    border-radius:12px;

    margin-top:20px;

    background:white;
}

button{
    padding:12px 25px;

    margin:10px;

    border:none;

    border-radius:8px;

    background:#4caf50;

    color:white;

    cursor:pointer;

    font-size:16px;
}

button:hover{
    background:#2e7d32;
}

h1,h3{
    text-shadow:2px 2px 10px black;
}

</style>

</head>

<body>

<div class="box">

<h1>
🎓 Certificate Generated
</h1>

<h3>
Name: {{name}}
</h3>

<h3>
Score: {{score}}
</h3>

<h3>
Percentage: {{percent}}%
</h3>

<h3>
Date: {{date}}
</h3>

<!-- PDF Preview -->

<iframe src="/static/certificate.pdf"></iframe>

<br>

<a href="/download">

    <button>
    ⬇ Download Certificate
    </button>

</a>

<a href="/">

    <button>
    🏠 Home
    </button>

</a>

</div>

</body>
</html>
